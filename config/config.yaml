# NovelCreator 配置 v2 — API Only

api:
  # OpenAI 兼容 API 配置
  base_url: "https://openrouter.ai/api/v1"
  api_key: "sk-or-...9d8f"  # 改用环境变量更安全：${OPENROUTER_API_KEY}
  timeout: 240

  # 按任务类型选择模型
  models:
    default: "openrouter/auto"
    outline: "z-ai/glm-4.5-air:free"
    review: "moonshotai/kimi-k2:free"
    content: "deepseek/deepseek-r1-0528:free"

# 路径配置
paths:
  novels_dir: "novels"

# 视频生成参数
settings:
  video:
    width: 1920
    height: 1080
    fps: 24
    font_size: 32
    text_color: [255, 255, 255]
    bg_color: [0, 0, 0]
    margin: 100
    line_spacing: 10
