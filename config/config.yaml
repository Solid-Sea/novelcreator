# 模型选择配置
model_selection:
  # 默认模型类型: "ollama" 或 "openai"
  default_type: "openai"

# Ollama模型配置
ollama:
  endpoint: "http://localhost:11434"  # Ollama API端点
  model: "deepseek-r1:14b"            # 默认使用模型
  hf_model: "unsloth/DeepSeek-R1-Distill-Qwen-14B"  # HuggingFace模型名称
  trust_remote_code: true             # 仅在启用本地TF模式时生效
  
  # Ollama任务特定模型配置（可选）
  models:
    outline: "qwen3:8b"      # 大纲生成模型
    review: "phi3:3.8b"      # 评论模型  
    content: "deepseek-r1:14b"  # 正文生成模型

# OpenAI兼容API配置
openai:
  api_key: "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"
  base_url: "https://openrouter.ai/api/v1"
  # 默认模型
  model: "openrouter/auto"
  
  # 任务特定模型配置
  models:
    outline: "z-ai/glm-4.5-air:free"      # 大纲生成模型
    review: "moonshotai/kimi-k2:free"     # 评论模型  
    content: "deepseek/deepseek-r1-0528:free"  # 正文生成模型

# 路径配置
paths:
  novels_dir: "novels"       # 小说存储目录

# 系统设置
settings:
  timeout: 240                # API请求超时（秒）

  # Reader机制配置（M1）
  reader:
    enabled: true
    max_review_rounds: 2
    min_total_score: 7
    hard_fail_dims: ["coherence", "character_consistency", "safety"]
    sample_review: true
    sample_strategy: ["head", "key", "tail"]
    max_summary_len: 400
    min_chapter_chars: 4000
    sample_threshold_chars: 5000

  # 视频生成参数（与实现对齐）
  video:
    width: 1920
    height: 1080
    fps: 24
    font_size: 32
    text_color: [255, 255, 255]
    bg_color: [0, 0, 0]
    margin: 100
    line_spacing: 10
