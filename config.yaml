ollama:
  endpoint: "http://192.168.31.26:11434/api/generate"
  model: "deepseek-r1:1.5b"
  hf_model: "onekq-ai/QwQ-32B-bnb-4bit"  # 本地模型名称
  temperature: 0.6

paths:
  novels_dir: "./novels"
  
settings:
  min_chapter_words: 4000
  max_retries: 20
  timeout: 30000
  video:                   # 新增：视频生成配置
    resolution: "1280x720"  # 视频分辨率
    font: "./novelcreator/assets/SimHei.ttf"  # 字体文件路径
    font_size: 24           # 字体大小
    scroll_speed: 2         # 滚动速度

blacklist: "./blacklist.yaml"