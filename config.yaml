ollama:
  endpoint: "http://localhost:11434/api/generate"
  model: "llama2"
  hf_model: "bartowski/google_gemma-3-27b-it-GGUF"
  temperature: 0.7

paths:
  novels_dir: "novels"
  model_cache: "model_cache"
  
settings:
  timeout: 120
  max_retries: 3
  video:
    resolution: "1920x1080"
    font: "assets/SimHei.ttf"
    font_size: 24
    scroll_speed: 2

memory:
  gpu_memory_fraction: 0.9
  model_offload: true

blacklist: "./blacklist.yaml"
