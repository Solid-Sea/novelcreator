ollama:
  endpoint: "http://localhost:11434/api/generate"
  model: "llama2"
  hf_model: "unsloth/DeepSeek-R1-Distill-Qwen-14B"
  temperature: 0.7
  trust_remote_code: true  # 添加信任远程代码选项
  allow_code_execution: true  # 允许执行模型代码
  use_auth_token: false  # 使用认证令牌访问私有模型

paths:
  novels_dir: "novels"
  model_cache: "model_cache"
  
settings:
  timeout: 120
  max_retries: 3
  video:
    resolution: "1920x1080"
    font: "assets/SimHei.ttf"
    font_size: 24
    scroll_speed: 2

memory:
  gpu_memory_fraction: 0.9
  model_offload: true

blacklist: "./blacklist.yaml"
