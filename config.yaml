# Ollama模型配置
ollama:
  endpoint: "http://localhost:11434/api/generate"  # Ollama API端点
  model: "llama2"                      # 默认使用模型
  temperature: 0.7                      # 生成温度（0-1）
  trust_remote_code: true               # 信任远程代码（必要时开启）
  allow_code_execution: true            # 允许模型执行代码（谨慎启用）

# HuggingFace模型配置
huggingface:
  model: "unsloth/DeepSeek-R1-Distill-Qwen-14B"  # HuggingFace模型
  use_auth_token: false                 # 使用HuggingFace认证令牌
  hf_token: "your_huggingface_token_here"  # HF令牌（https://huggingface.co/settings/tokens）

# 路径配置
paths:
  novels_dir: "novels"       # 小说存储目录
  model_cache: "model_cache"  # 模型缓存目录

# 系统设置
settings:
  timeout: 120                # API请求超时（秒）
  max_retries: 3              # 最大重试次数

  # 视频生成参数
  video:
    resolution: "1920x1080"   # 输出视频分辨率
    font: "assets/SimHei.ttf" # 中文字体文件路径
    font_size: 24             # 字幕字体大小
    scroll_speed: 2           # 字幕滚动速度（像素/帧）
    fps: 24                   # 视频帧率
    codec: libx264            # 视频编码器（修正拼写错误）
