# AI模型配置
model:
  name: "gpt2"  # 使用的模型名称
  max_length: 32768  # 生成文本的最大长度

# 章节生成配置
chapter:
  min_words: 4000  # 每章最少字数
  max_retries: 10  # 生成失败时的最大重试次数

# 系统配置
system:
  timeout: 3000  # 请求超时时间（毫秒）

# 日志配置
logging:
  level: "info"  # 日志级别：debug, info, warning, error
  file: "novel_creator.log"  # 日志文件路径
