ollama:
  endpoint: "http://192.168.31.26:11434/api/generate"
  model: "deepseek-r1:1.5b"  # 或您安装的其他模型
  temperature: 0.6  # 增加创意性

llama:
  model_path: "D:/novelcreator-v2/models/Zyphra_ZR1-1.5B-IQ4_XS.gguf"  # GGUF模型路径
  n_ctx: 16384        # 上下文长度
